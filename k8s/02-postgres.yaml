# PostgreSQL: StatefulSet + PersistentVolumeClaim (los datos sobreviven si el pod se borra).
# El DDL (sql/*.sql) llega por el ConfigMap "sql-init" (lo crea levantar.ps1) y se ejecuta
# solo la primera vez, con el volumen vacío.
apiVersion: v1
kind: Service
metadata:
  name: postgres            # nombre DNS que usan el ETL, el simulador y Grafana
  namespace: taller6
spec:
  clusterIP: None           # headless: identidad estable para el StatefulSet
  selector: {app: postgres}
  ports:
    - {name: pg, port: 5432, targetPort: 5432}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-externo    # acceso desde el equipo (DBeaver, Power BI): localhost:5434
  namespace: taller6
spec:
  # LoadBalancer y no NodePort: en Docker Desktop (modo kind) el nodo es un contenedor y
  # sus NodePort no llegan al equipo; Docker Desktop sí publica los LoadBalancer en localhost.
  type: LoadBalancer
  selector: {app: postgres}
  ports:
    - {name: pg, port: 5434, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: taller6
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16.15-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: pg-credenciales}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {containerPort: 5432, name: pg}
          volumeMounts:
            - {name: datos-pg, mountPath: /var/lib/postgresql/data}
            - {name: sql-init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          readinessProbe:             # recibe tráfico solo cuando acepta conexiones
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:              # si deja de responder, Kubernetes lo reinicia
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 60   # margen para el initdb de la primera vez
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
      volumes:
        - name: sql-init
          configMap: {name: sql-init}
  volumeClaimTemplates:
    - metadata:
        name: datos-pg
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
